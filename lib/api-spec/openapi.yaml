openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: gemini
    description: Gemini AI chat and image operations
  - name: memories
    description: Agent memory management
  - name: documents
    description: Document management
  - name: events
    description: Agent event logs
  - name: stats
    description: Agent statistics and dashboard
  - name: search
    description: Web search and source verification
  - name: reflect
    description: Reflection job endpoints
  - name: settings
    description: Agent configuration settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /gemini/search:
    get:
      operationId: searchGeminiMessages
      tags: [gemini]
      summary: Search messages across all conversations
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeminiSearchResult"

  /gemini/conversations:
    get:
      operationId: listGeminiConversations
      tags: [gemini]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeminiConversation"
    post:
      operationId: createGeminiConversation
      tags: [gemini]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGeminiConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiConversation"

  /gemini/conversations/{id}/pin:
    patch:
      operationId: pinGeminiConversation
      tags: [gemini]
      summary: Toggle pin on a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiConversation"

  /gemini/conversations/{id}/archive:
    patch:
      operationId: archiveGeminiConversation
      tags: [gemini]
      summary: Toggle archive on a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiConversation"

  /gemini/conversations/{id}:
    get:
      operationId: getGeminiConversation
      tags: [gemini]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
    patch:
      operationId: renameGeminiConversation
      tags: [gemini]
      summary: Rename a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameGeminiConversationBody"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiConversation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"
    delete:
      operationId: deleteGeminiConversation
      tags: [gemini]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiError"

  /gemini/messages/{messageId}/react:
    post:
      operationId: reactToMessage
      tags: [gemini]
      summary: Set or update a reaction on a message
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactToMessageBody"
      responses:
        "200":
          description: Reaction saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageReaction"
        "404":
          description: Not found
    delete:
      operationId: deleteMessageReaction
      tags: [gemini]
      summary: Remove a reaction from a message
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Reaction removed
        "404":
          description: Not found

  /gemini/conversations/{id}/reactions:
    get:
      operationId: listConversationReactions
      tags: [gemini]
      summary: List all reactions for a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reactions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageReaction"

  /gemini/conversations/{id}/messages:
    get:
      operationId: listGeminiMessages
      tags: [gemini]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeminiMessage"
    post:
      operationId: sendGeminiMessage
      tags: [gemini]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendGeminiMessageBody"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

  /gemini/generate-image:
    post:
      operationId: generateGeminiImage
      tags: [gemini]
      summary: Generate an image from a text prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateGeminiImageBody"
      responses:
        "200":
          description: Generated image data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateGeminiImageResponse"

  /memories:
    get:
      operationId: listMemories
      tags: [memories]
      summary: List memories with optional type/owner filter
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [preference, fact, workflow, lesson]
        - name: owner
          in: query
          required: false
          schema:
            type: string
            enum: [agent, user]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of memories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memory"
    post:
      operationId: createMemory
      tags: [memories]
      summary: Create a new memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMemoryBody"
      responses:
        "201":
          description: Created memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"

  /memories/{id}:
    put:
      operationId: updateMemory
      tags: [memories]
      summary: Update a memory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemoryBody"
      responses:
        "200":
          description: Updated memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
    delete:
      operationId: deleteMemory
      tags: [memories]
      summary: Delete a memory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [local, web, web_verified]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Create or import a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentBody"
      responses:
        "201":
          description: Created document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get a document by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /events:
    get:
      operationId: listAgentEvents
      tags: [events]
      summary: List agent events / logs
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [success, error, retrying, degraded]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: List of agent events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentEvent"

  /stats/dashboard:
    get:
      operationId: getDashboardStats
      tags: [stats]
      summary: Get aggregated dashboard statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /stats/tool-health:
    get:
      operationId: getToolHealth
      tags: [stats]
      summary: Get tool health and circuit breaker status
      responses:
        "200":
          description: Tool health report
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ToolHealth"

  /stats/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [stats]
      summary: Get recent agent activity timeline
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /stats/feedback:
    get:
      operationId: getFeedbackStats
      tags: [stats]
      summary: Get message reaction feedback summary
      responses:
        "200":
          description: Feedback statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackStats"

  /search:
    post:
      operationId: runWebSearch
      tags: [search]
      summary: Search the web, verify across sources, and store results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebSearchBody"
      responses:
        "200":
          description: Verified search result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSearchResult"

  /web-sources:
    get:
      operationId: listWebSources
      tags: [search]
      summary: List stored web sources
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, verified, uncertain, conflicted]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of web sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebSource"

  /web-sources/{id}:
    delete:
      operationId: deleteWebSource
      tags: [search]
      summary: Delete a stored web source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get agent settings
      responses:
        "200":
          description: Current agent settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSettings"
    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update agent settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsBody"
      responses:
        "200":
          description: Updated agent settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentSettings"

  /rag/backfill:
    post:
      operationId: ragBackfill
      tags: [search]
      summary: Backfill embeddings for all existing records missing vectors (SSE stream)
      responses:
        "200":
          description: SSE stream of backfill progress events
          content:
            text/event-stream:
              schema:
                type: string

  /rag/search:
    post:
      operationId: ragSearch
      tags: [search]
      summary: Semantic RAG search across memories, documents, and web sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RagSearchBody"
      responses:
        "200":
          description: Ranked semantic search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RagSearchResponse"

  /reflect:
    post:
      operationId: runReflection
      tags: [reflect]
      summary: Run a reflection job over recent conversations to extract memories
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunReflectionBody"
      responses:
        "200":
          description: Reflection result with newly created memories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReflectionResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ReactToMessageBody:
      type: object
      properties:
        reaction:
          type: string
          enum: [helpful, unhelpful]
      required:
        - reaction

    FeedbackDayBucket:
      type: object
      properties:
        date:
          type: string
        helpful:
          type: integer
        unhelpful:
          type: integer
      required:
        - date
        - helpful
        - unhelpful

    FeedbackConversation:
      type: object
      properties:
        conversationId:
          type: integer
        title:
          type: string
        helpful:
          type: integer
        unhelpful:
          type: integer
      required:
        - conversationId
        - title
        - helpful
        - unhelpful

    FeedbackStats:
      type: object
      properties:
        totalHelpful:
          type: integer
        totalUnhelpful:
          type: integer
        last7Days:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackDayBucket"
        topConversations:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackConversation"
      required:
        - totalHelpful
        - totalUnhelpful
        - last7Days
        - topConversations

    MessageReaction:
      type: object
      properties:
        id:
          type: integer
        messageId:
          type: integer
        reaction:
          type: string
          enum: [helpful, unhelpful]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - messageId
        - reaction
        - createdAt

    GeminiSearchResult:
      type: object
      properties:
        messageId:
          type: integer
        conversationId:
          type: integer
        conversationTitle:
          type: string
        role:
          type: string
        excerpt:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - messageId
        - conversationId
        - conversationTitle
        - role
        - excerpt
        - createdAt

    RenameGeminiConversationBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
      required:
        - title

    GeminiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        pinned:
          type: boolean
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - pinned
        - archived
        - createdAt

    GeminiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    CreateGeminiConversationBody:
      type: object
      properties:
        title:
          type: string
      required:
        - title

    SendGeminiMessageBody:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    GeminiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/GeminiMessage"
      required:
        - id
        - title
        - createdAt
        - messages

    GenerateGeminiImageBody:
      type: object
      properties:
        prompt:
          type: string
      required:
        - prompt

    GenerateGeminiImageResponse:
      type: object
      properties:
        b64_json:
          type: string
        mimeType:
          type: string
      required:
        - b64_json
        - mimeType

    GeminiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Memory:
      type: object
      properties:
        id:
          type: integer
        owner:
          type: string
        type:
          type: string
        content:
          type: string
        importanceScore:
          type: integer
        category:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - owner
        - type
        - content
        - importanceScore
        - createdAt

    CreateMemoryBody:
      type: object
      properties:
        owner:
          type: string
          enum: [agent, user]
        type:
          type: string
          enum: [preference, fact, workflow, lesson]
        content:
          type: string
        importanceScore:
          type: integer
        category:
          type: string
      required:
        - owner
        - type
        - content
        - importanceScore

    UpdateMemoryBody:
      type: object
      properties:
        content:
          type: string
        importanceScore:
          type: integer
        category:
          type: string

    Document:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        source:
          type: string
        url:
          type: string
        canonicalCategory:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - source
        - content
        - createdAt

    CreateDocumentBody:
      type: object
      properties:
        title:
          type: string
        source:
          type: string
          enum: [local, web, web_verified]
        url:
          type: string
        canonicalCategory:
          type: string
        content:
          type: string
      required:
        - title
        - source
        - content

    AgentEvent:
      type: object
      properties:
        id:
          type: integer
        eventType:
          type: string
        contextId:
          type: string
        payload:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - eventType
        - status
        - createdAt

    DashboardStats:
      type: object
      properties:
        totalConversations:
          type: integer
        totalMessages:
          type: integer
        totalMemories:
          type: integer
        totalDocuments:
          type: integer
        recentErrors:
          type: integer
        memoriesByType:
          type: object
          additionalProperties:
            type: integer
        eventsByStatus:
          type: object
          additionalProperties:
            type: integer
      required:
        - totalConversations
        - totalMessages
        - totalMemories
        - totalDocuments
        - recentErrors
        - memoriesByType
        - eventsByStatus

    ToolHealth:
      type: object
      properties:
        toolName:
          type: string
        successRate:
          type: number
        recentFailures:
          type: integer
        status:
          type: string
          enum: [healthy, degraded, disabled]
        lastCheckedAt:
          type: string
          format: date-time
      required:
        - toolName
        - successRate
        - recentFailures
        - status

    ActivityItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time

    RagSearchBody:
      type: object
      properties:
        query:
          type: string
          description: The search query for semantic retrieval
        limit:
          type: integer
          description: Maximum number of results to return (default 10)
        threshold:
          type: number
          description: Minimum cosine similarity threshold (default 0.45)
      required:
        - query

    RagResult:
      type: object
      properties:
        id:
          type: integer
        source:
          type: string
          enum: [memory, document, web_source]
        content:
          type: string
        title:
          type: string
        similarity:
          type: number
        metadata:
          type: object
      required:
        - id
        - source
        - content
        - similarity
        - metadata

    RagSearchResponse:
      type: object
      properties:
        query:
          type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/RagResult"
      required:
        - query
        - results

    WebSearchBody:
      type: object
      properties:
        query:
          type: string
          description: The search query
        minSources:
          type: integer
          description: Minimum sources required to verify a claim (default 2)
      required:
        - query

    WebSourceItem:
      type: object
      properties:
        url:
          type: string
        title:
          type: string
        snippet:
          type: string
        trustScore:
          type: number
        verificationStatus:
          type: string
      required:
        - url
        - title
        - snippet
        - trustScore
        - verificationStatus

    WebSearchResult:
      type: object
      properties:
        query:
          type: string
        verificationStatus:
          type: string
          enum: [verified, uncertain, conflicted]
        consolidatedSummary:
          type: string
        sourcesChecked:
