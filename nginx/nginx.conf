server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / streaming: disable all buffering so tokens reach the client
        # immediately as they are produced.
        proxy_buffering            off;
        proxy_cache                off;
        proxy_read_timeout         300s;
        proxy_connect_timeout      10s;

        # Allow large JSON bodies (document uploads, etc.)
        client_max_body_size 50m;
    }

    # ── Static frontend (SPA fallback) ─────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Aggressive caching for hashed assets (Vite fingerprints them)
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Health endpoint ────────────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Increase header buffer for large auth tokens / cookies
    large_client_header_buffers 4 16k;
}
