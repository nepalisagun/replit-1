# docker-compose.prod.yml — production overrides
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# What this file adds on top of docker-compose.yml:
#   • Pulls pre-built images from ghcr.io instead of building locally
#   • Watchtower — polls ghcr.io every 5 minutes and hot-swaps containers
#     when a new image is published (zero-touch continuous deployment)
#   • Slack / Discord / webhook notifications on every update or failure
#   • Resource limits and restart policies tuned for production
#   • Structured JSON logging for both services
#
# Notification quick-start (pick one, set in .env):
#
#   Slack incoming webhook:
#     WATCHTOWER_NOTIFICATION_URL=generic+https://hooks.slack.com/services/T.../B.../xxx
#
#   Discord webhook:
#     WATCHTOWER_NOTIFICATION_URL=discord://TOKEN@CHANNEL_ID
#
#   Any HTTP endpoint (e.g. n8n, Zapier, custom):
#     WATCHTOWER_NOTIFICATION_URL=generic+https://your-server.com/webhook
#
#   Multiple destinations (space-separated):
#     WATCHTOWER_NOTIFICATION_URL=discord://... generic+https://...
#
# Leave WATCHTOWER_NOTIFICATION_URL unset to disable notifications entirely.

services:
  api:
    # Replace the local build with the published image.
    # Pin to a specific version in production; use :latest for auto-updates.
    image: ghcr.io/${GITHUB_REPOSITORY:-nepalisagun/replit-1}/nexus-api:${RELEASE_TAG:-latest}
    build: !reset null
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    # Healthcheck so Watchtower and Docker know when the container is ready
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:$$PORT/api/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-nepalisagun/replit-1}/nexus-web:${RELEASE_TAG:-latest}
    build: !reset null
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # ── Watchtower ─────────────────────────────────────────────────────────────
  # Watches all running containers that have the
  # "com.centurylinklabs.watchtower.enable=true" label, pulls updated images
  # from ghcr.io, and recreates the containers with zero manual intervention.
  #
  # Authentication: mount ~/.docker/config.json (created by `docker login`)
  # or set REPO_USER / REPO_PASS env vars (see watchtower docs).
  watchtower:
    image: containrrr/watchtower:latest
    restart: always
    volumes:
      # Gives Watchtower access to the Docker socket so it can manage containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Reuse host Docker credentials for ghcr.io (set up via `docker login ghcr.io`)
      - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      # ── Watching ───────────────────────────────────────────────────────────
      # Only containers with the watchtower.enable=true label are monitored.
      WATCHTOWER_LABEL_ENABLE: "true"
      # Poll ghcr.io every 5 minutes.
      WATCHTOWER_POLL_INTERVAL: "300"
      # Remove superseded images to reclaim disk space.
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_LOG_LEVEL: info
      TZ: UTC

      # ── Notifications ──────────────────────────────────────────────────────
      # shoutrrr-formatted URL(s). Leave blank/unset to silence all alerts.
      # See the comment block at the top of this file for URL formats.
      WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_NOTIFICATION_URL:-}

      # Emit a single summary report after each poll cycle instead of one
      # message per updated container (quieter for frequent deploys).
      WATCHTOWER_NOTIFICATION_REPORT: "true"

      # Only send notifications for updates and errors — skip "no update" pings.
      WATCHTOWER_NOTIFICATIONS_LEVEL: info

      # Custom Go-template message. Variables come from Watchtower's Report type.
      # Produces a message like:
      #   🚀 Nexus Agent updated
      #   ✅ nexus-api   → sha256:abc1234
      #   ✅ nexus-web   → sha256:def5678
      #   ❌ (none failed)
      WATCHTOWER_NOTIFICATION_TEMPLATE: |
        {{- if .Report.Updated -}}
        🚀 *Nexus Agent* deployed new images on `{{ .Host }}`
        {{range .Report.Updated}}✅ `{{.Name}}` → `{{.ImageName}}`
        {{end}}
        {{- end -}}
        {{- if .Report.Fresh -}}
        ℹ️ Already up to date: {{range .Report.Fresh}}`{{.Name}}` {{end}}
        {{- end -}}
        {{- if .Report.Failed -}}
        ❌ *Update failed* for: {{range .Report.Failed}}`{{.Name}}` ({{.Error}}) {{end}}
        {{- end -}}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    labels:
      # Watchtower watches itself too — keeps it up to date automatically
      com.centurylinklabs.watchtower.enable: "true"

