name: Docker Build & Smoke Test

on:
  push:
    branches:
      - repelit-dockerize
  pull_request:
    branches:
      - repelit-dockerize

jobs:
  build-and-test:
    name: Build images & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Dummy values — enough to pass the build and start the containers.
      # The smoke test only checks HTTP connectivity, not real AI responses.
      POSTGRES_PASSWORD: ci_secret
      SESSION_SECRET: ci_session_secret_32_chars_minimum
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci_dummy_key' }}
      HOST_PORT: 8080

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Docker layer cache ────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
          load: true
          tags: nexus-api:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          load: true
          tags: nexus-web:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Prevent cache from growing indefinitely
      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # ── Smoke test ────────────────────────────────────────────────────────
      - name: Write .env for docker compose
        run: |
          cat <<EOF > .env
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          SESSION_SECRET=${SESSION_SECRET}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          HOST_PORT=${HOST_PORT}
          EOF

      - name: Start services
        run: |
          # Override image references so compose uses the images we just built
          docker compose up --no-build --wait --wait-timeout 90 &
          # Give services time to initialise
          sleep 15

      - name: Smoke test — nginx health endpoint
        run: |
          curl --retry 10 --retry-delay 3 --retry-connrefused \
               --fail --silent --show-error \
               http://localhost:${HOST_PORT}/health
          echo "nginx: OK"

      - name: Smoke test — API health endpoint
        run: |
          curl --retry 10 --retry-delay 3 --retry-connrefused \
               --fail --silent --show-error \
               http://localhost:${HOST_PORT}/api/healthz
          echo "API: OK"

      - name: Smoke test — Frontend index.html served
        run: |
          STATUS=$(curl --retry 5 --retry-delay 2 --retry-connrefused \
                        --silent --output /dev/null --write-out "%{http_code}" \
                        http://localhost:${HOST_PORT}/)
          echo "HTTP status: ${STATUS}"
          [ "${STATUS}" = "200" ] || { echo "Expected 200, got ${STATUS}"; exit 1; }

      # ── Tear down ─────────────────────────────────────────────────────────
      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down --volumes
