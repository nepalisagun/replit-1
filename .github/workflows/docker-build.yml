name: Docker Build, Smoke Test & Publish

on:
  push:
    branches:
      - repelit-dockerize
  pull_request:
    branches:
      - repelit-dockerize

env:
  REGISTRY: ghcr.io
  # github.repository is "owner/repo-name"
  API_IMAGE: ghcr.io/${{ github.repository }}/nexus-api
  WEB_IMAGE: ghcr.io/${{ github.repository }}/nexus-web

jobs:
  build-test-publish:
    name: Build → Smoke test → Publish
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Required for pushing images to ghcr.io using GITHUB_TOKEN
    permissions:
      contents: read
      packages: write

    env:
      POSTGRES_PASSWORD: ci_secret
      SESSION_SECRET: ci_session_secret_32_chars_minimum
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci_dummy_key' }}
      HOST_PORT: 8080

    steps:
      # ── Checkout ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Docker Buildx + layer cache ────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # ── Log in to ghcr.io (only on real pushes, not PRs from forks) ────────
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Compute image tags ─────────────────────────────────────────────────
      - name: Compute image metadata (api)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/repelit-dockerize' }}

      - name: Compute image metadata (web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/repelit-dockerize' }}

      # ── Build api image ────────────────────────────────────────────────────
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          # Load into local Docker daemon for the smoke test.
          # On PRs we do not push to the registry.
          load: true
          push: false
          tags: nexus-api:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # ── Build web image ────────────────────────────────────────────────────
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          load: true
          push: false
          tags: nexus-web:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Rotate build cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # ── Smoke test ─────────────────────────────────────────────────────────
      - name: Write .env for docker compose
        run: |
          cat <<EOF > .env
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          SESSION_SECRET=${SESSION_SECRET}
          GEMINI_API_KEY=${GEMINI_API_KEY}
          HOST_PORT=${HOST_PORT}
          EOF

      - name: Start services
        run: docker compose up --no-build --wait --wait-timeout 90 &

      - name: Wait for services to stabilise
        run: sleep 20

      - name: Smoke test — nginx /health
        run: |
          curl --retry 10 --retry-delay 3 --retry-connrefused \
               --fail --silent --show-error \
               http://localhost:${HOST_PORT}/health
          echo "nginx: OK"

      - name: Smoke test — API /api/healthz
        run: |
          curl --retry 10 --retry-delay 3 --retry-connrefused \
               --fail --silent --show-error \
               http://localhost:${HOST_PORT}/api/healthz
          echo "API: OK"

      - name: Smoke test — Frontend index.html (HTTP 200)
        run: |
          STATUS=$(curl --retry 5 --retry-delay 2 --retry-connrefused \
                        --silent --output /dev/null --write-out "%{http_code}" \
                        http://localhost:${HOST_PORT}/)
          echo "HTTP status: ${STATUS}"
          [ "${STATUS}" = "200" ] || { echo "Expected 200, got ${STATUS}"; exit 1; }

      - name: Stop services
        if: always()
        run: docker compose down --volumes

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --no-color

      # ── Publish to ghcr.io (push events only) ─────────────────────────────
      # Re-build with --push after the smoke test passes.  The Buildx cache
      # means this is essentially free — layers are already warm.
      - name: Publish api image to ghcr.io
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache

      - name: Publish web image to ghcr.io
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache

      # ── Print pull commands ────────────────────────────────────────────────
      - name: Print published image references
        if: github.event_name == 'push'
        run: |
          echo ""
          echo "Images published to ghcr.io:"
          echo "  docker pull ${{ env.API_IMAGE }}:latest"
          echo "  docker pull ${{ env.WEB_IMAGE }}:latest"
          echo ""
          echo "SHA-pinned tags:"
          echo "${{ steps.meta-api.outputs.tags }}" | grep sha
          echo "${{ steps.meta-web.outputs.tags }}" | grep sha
